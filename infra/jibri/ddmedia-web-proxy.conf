# Proxy local do gravador (Jibri): o Chrome do Jibri abre http://localhost:8000 (contexto seguro) e este nginx repassa ao servico `web` do Jitsi.
# Alem de repassar, troca o logo do Jitsi (marca d'agua) pelo logo da marca, servido pelo painel (/flow-api/recording-logo; sem logo cadastrado, imagem transparente).
# So afeta a pagina que o Jibri grava; os participantes usam a configuracao do painel (RoomFlow).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log off;
  client_body_temp_path /tmp/c;
  proxy_temp_path /tmp/p;
  fastcgi_temp_path /tmp/f;
  uwsgi_temp_path /tmp/u;
  scgi_temp_path /tmp/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 127.0.0.1:8000;

    # O web do Jitsi embute config.js dentro do index.html (SSI), entao a troca e feita na pagina HTML.
    location / {
      proxy_pass http://web:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 3600s;
      sub_filter_once on;
      sub_filter 'var config = {};' "var config = {}; config.defaultLogoUrl = 'https://{{DOMAIN}}/flow-api/recording-logo';";
    }
  }
}
